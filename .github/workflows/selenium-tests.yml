
name: SauceDemo Selenium Tests

on:
  workflow_dispatch:
    inputs:
      execution_id:
        description: "Execution Id"
        type: string
        required: true

      file_name:
        description: "Input Excel File Name"
        type: string
        required: true

      environment:
        description: "Execution Environment"
        type: choice
        required: true
        options:
          - E2E1
          - E2E2
          - QA
          - UAT
          - PROD

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Display Execution Details
        shell: pwsh
        run: |
          Write-Host "Execution ID: ${{ inputs.execution_id }}"
          Write-Host "File Name: ${{ inputs.file_name }}"
          Write-Host "Environment: ${{ inputs.environment }}"

      - name: Validate Excel File
        shell: pwsh
        run: |
          $filePath = Join-Path "${{ github.workspace }}" "input-data/${{ inputs.execution_id }}/${{ inputs.file_name }}"

          if (!(Test-Path -LiteralPath $filePath -PathType Leaf)) {
              Write-Error "Excel file not found: $filePath"
              exit 1
          }

          Write-Host "Excel file found: $filePath"

      - name: Run Selenium Tests
        shell: pwsh
        run: |
          $filePath = Join-Path "${{ github.workspace }}" "input-data/${{ inputs.execution_id }}/${{ inputs.file_name }}"

          mvn -B clean test "-Dexcel.path=$filePath" "-Dexcel.sheet=${{ inputs.environment }}"

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ inputs.execution_id }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 15
